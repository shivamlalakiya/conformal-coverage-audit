[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-coverage"
version = "0.1.0"
description = "Exact rank arithmetic for finite-sample distribution-free prediction bounds"
readme = "README-package.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
    "conformal prediction",
    "finite-sample coverage",
    "order statistics",
    "prediction intervals",
    "distribution-free",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# No runtime dependencies, deliberately. Everything here is stdlib fractions and
# math, so the module can be vendored as a single file by a library that does not
# want another requirement.
dependencies = []

[tool.setuptools]
packages = ["conformal_coverage"]
